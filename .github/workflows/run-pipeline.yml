name: Run Forecasting Pipeline

on:
  push:
    paths:
      - 'src/**'
      - 'data/**'
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Generate Demand Dataset"]
    types: [completed]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure dataset exists
        run: |
          if [ ! -f data/demand_data.csv ]; then
            python src/generate_data.py
          fi

      - name: Run EDA
        run: python src/eda.py

      - name: Run forecasting model quick-check
        run: python src/forecasting_models.py

      - name: Run backtesting and evaluation
        run: python src/evaluate.py

      - name: Run inventory policy calculations
        run: python src/inventory_policy.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/demand_data.csv
          git diff --staged --quiet || git commit -m "Auto-run pipeline: update EDA charts, backtest results, inventory policy [skip ci]"
          git pull --rebase origin main
          git push
